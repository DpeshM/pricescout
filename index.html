<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceScout - Compare Product Prices</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .tagline {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 40px;
        }

        .search-form {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin: 40px 0;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .location-info {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }

        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 1.5em;
            color: #667eea;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .product-store {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .product-shipping {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .product-availability {
            display: inline-block;
            padding: 4px 10px;
            background: #4caf50;
            color: white;
            border-radius: 12px;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .local-badge {
            display: inline-block;
            padding: 4px 10px;
            background: #ff9800;
            color: white;
            border-radius: 12px;
            font-size: 0.85em;
            margin-top: 10px;
            margin-left: 5px;
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin: 40px 0;
        }

        @media (max-width: 768px) {
            .search-form {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .results-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 PriceScout</h1>
            <p class="tagline">Find the best deals in your location</p>
        </header>

        <div class="search-container">
            <form class="search-form" id="searchForm">
                <div class="input-group">
                    <label for="productName">Product Name</label>
                    <input 
                        type="text" 
                        id="productName" 
                        placeholder="e.g., iPhone 15, Nike Air Max..."
                        required
                    >
                </div>
                <div class="input-group">
                    <label for="location">Location</label>
                    <input 
                        type="text" 
                        id="location" 
                        placeholder="e.g., Nepal, India, USA"
                        required
                    >
                </div>
                <button type="submit" id="searchBtn">Search</button>
            </form>
        </div>

        <div id="locationInfo" class="location-info" style="display: none;"></div>

        <div id="loadingContainer" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Searching for the best prices in your location...</p>
        </div>

        <div id="resultsContainer" class="results-container"></div>
        <div id="noResults" class="no-results" style="display: none;">
            No results found. Try adjusting your search terms.
        </div>
    </div>

    <script>
        const form = document.getElementById('searchForm');
        const resultsContainer = document.getElementById('resultsContainer');
        const loadingContainer = document.getElementById('loadingContainer');
        const noResults = document.getElementById('noResults');
        const searchBtn = document.getElementById('searchBtn');
        const locationInfo = document.getElementById('locationInfo');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const productName = document.getElementById('productName').value;
            const location = document.getElementById('location').value;
            
            resultsContainer.innerHTML = '';
            noResults.style.display = 'none';
            locationInfo.style.display = 'none';
            loadingContainer.style.display = 'block';
            searchBtn.disabled = true;

            try {
                // First search: Find products available in the specified location
                const locationQuery = `buy ${productName} in ${location} online shopping stores price`;
                
                const response1 = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1000,
                        tools: [{
                            type: 'web_search_20250305',
                            name: 'web_search'
                        }],
                        messages: [{
                            role: 'user',
                            content: `Search for online stores and marketplaces that sell "${productName}" and deliver to or operate in ${location}. Return ONLY a JSON array with format: [{"title":"product name","price":"price in local currency","store":"store name","url":"actual product url","shipping":"ships to ${location}" or "local store","isLocal":true/false}]. Include both local stores and international stores that ship there. Return ONLY the JSON array.`
                        }]
                    })
                });

                const data1 = await response1.json();
                let productsText = '';
                
                for (const content of data1.content) {
                    if (content.type === 'text') {
                        productsText += content.text;
                    }
                }

                const jsonMatch = productsText.match(/\[[\s\S]*\]/);
                let products = [];
                
                if (jsonMatch) {
                    try {
                        products = JSON.parse(jsonMatch[0]);
                    } catch (e) {
                        console.error('JSON parse error:', e);
                    }
                }

                // If no results from AI search, do a second search with different query
                if (products.length === 0) {
                    const response2 = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 1000,
                            tools: [{
                                type: 'web_search_20250305',
                                name: 'web_search'
                            }],
                            messages: [{
                                role: 'user',
                                content: `Find where to buy "${productName}" in ${location}. What are the popular e-commerce sites and stores in ${location}?`
                            }]
                        })
                    });

                    const data2 = await response2.json();
                    let locationText = '';
                    
                    for (const content of data2.content) {
                        if (content.type === 'text') {
                            locationText += content.text;
                        }
                    }

                    // Show location-specific information
                    locationInfo.innerHTML = `📍 Searching for ${productName} in ${location}...<br><small>${locationText.substring(0, 200)}...</small>`;
                    locationInfo.style.display = 'block';
                }

                // If still no products, show location-aware message
                if (products.length === 0) {
                    noResults.innerHTML = `We couldn't find specific listings for "${productName}" available in ${location}. This could mean:<br><br>
                    • The product may not be widely available in ${location}<br>
                    • Try searching for local e-commerce sites directly<br>
                    • Consider international shipping options<br><br>
                    <small>Popular sites in ${location} may include local marketplaces or international retailers that ship there.</small>`;
                    noResults.style.display = 'block';
                } else {
                    displayResults(products, location);
                }
                
            } catch (error) {
                console.error('Error:', error);
                noResults.innerHTML = `Error searching for products. Please try again.`;
                noResults.style.display = 'block';
            }

            loadingContainer.style.display = 'none';
            searchBtn.disabled = false;
        });

        function displayResults(products, location) {
            if (products.length === 0) {
                noResults.style.display = 'block';
                return;
            }

            locationInfo.innerHTML = `📍 Showing ${products.length} results for products available in ${location}`;
            locationInfo.style.display = 'block';

            // Sort by local stores first, then by price
            products.sort((a, b) => {
                if (a.isLocal !== b.isLocal) {
                    return b.isLocal - a.isLocal;
                }
                const priceA = parseFloat(a.price.replace(/[^0-9.]/g, ''));
                const priceB = parseFloat(b.price.replace(/[^0-9.]/g, ''));
                return priceA - priceB;
            });

            products.forEach(product => {
                const card = document.createElement('a');
                card.className = 'product-card';
                card.href = product.url;
                card.target = '_blank';
                
                card.innerHTML = `
                    <div class="product-image"></div>
                    <div class="product-info">
                        <div class="product-title">${product.title}</div>
                        <div class="product-price">${product.price}</div>
                        <div class="product-store">🏪 ${product.store}</div>
                        <div class="product-shipping">📦 ${product.shipping || 'Check shipping options'}</div>
                        ${product.isLocal ? '<span class="local-badge">Local Store</span>' : '<span class="product-availability">Ships to ' + location + '</span>'}
                    </div>
                `;
                
                resultsContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
