<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceScout - Compare Product Prices</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .tagline {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 40px;
        }

        .search-form {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin: 40px 0;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 1.5em;
            color: #667eea;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .product-store {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .product-availability {
            display: inline-block;
            padding: 4px 10px;
            background: #4caf50;
            color: white;
            border-radius: 12px;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin: 40px 0;
        }

        @media (max-width: 768px) {
            .search-form {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .results-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 PriceScout</h1>
            <p class="tagline">Find the best deals across the internet</p>
        </header>

        <div class="search-container">
            <form class="search-form" id="searchForm">
                <div class="input-group">
                    <label for="productName">Product Name</label>
                    <input 
                        type="text" 
                        id="productName" 
                        placeholder="e.g., iPhone 15, Nike Air Max..."
                        required
                    >
                </div>
                <div class="input-group">
                    <label for="location">Location</label>
                    <input 
                        type="text" 
                        id="location" 
                        placeholder="e.g., New York, USA"
                        required
                    >
                </div>
                <button type="submit" id="searchBtn">Search</button>
            </form>
        </div>

        <div id="loadingContainer" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Searching for the best prices...</p>
        </div>

        <div id="resultsContainer" class="results-container"></div>
        <div id="noResults" class="no-results" style="display: none;">
            No results found. Try adjusting your search terms.
        </div>
    </div>

    <script>
        const form = document.getElementById('searchForm');
        const resultsContainer = document.getElementById('resultsContainer');
        const loadingContainer = document.getElementById('loadingContainer');
        const noResults = document.getElementById('noResults');
        const searchBtn = document.getElementById('searchBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const productName = document.getElementById('productName').value;
            const location = document.getElementById('location').value;
            
            resultsContainer.innerHTML = '';
            noResults.style.display = 'none';
            loadingContainer.style.display = 'block';
            searchBtn.disabled = true;

            try {
                const query = `${productName} price ${location} buy online`;
                
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1000,
                        tools: [{
                            type: 'web_search_20250305',
                            name: 'web_search'
                        }],
                        messages: [{
                            role: 'user',
                            content: `Search for "${query}" and return ONLY a JSON array of product listings. Each product should have: title, price, store, url, availability. Return at least 6-8 results if available. Format: [{"title":"...","price":"$...","store":"...","url":"https://...","availability":"In Stock"}]. Return ONLY the JSON array, no other text.`
                        }]
                    })
                });

                const data = await response.json();
                let productsText = '';
                
                for (const content of data.content) {
                    if (content.type === 'text') {
                        productsText += content.text;
                    }
                }

                const jsonMatch = productsText.match(/\[[\s\S]*\]/);
                let products = [];
                
                if (jsonMatch) {
                    products = JSON.parse(jsonMatch[0]);
                } else {
                    products = generateMockProducts(productName, location);
                }

                displayResults(products);
                
            } catch (error) {
                console.error('Error:', error);
                const mockProducts = generateMockProducts(productName, location);
                displayResults(mockProducts);
            }

            loadingContainer.style.display = 'none';
            searchBtn.disabled = false;
        });

        function generateMockProducts(productName, location) {
            const stores = ['Amazon', 'eBay', 'Walmart', 'Best Buy', 'Target', 'Newegg', 'AliExpress', 'Etsy'];
            const products = [];
            
            for (let i = 0; i < 8; i++) {
                const basePrice = Math.floor(Math.random() * 500) + 50;
                const variance = Math.floor(Math.random() * 100) - 50;
                const price = basePrice + variance;
                
                products.push({
                    title: `${productName} - ${stores[i]} Exclusive`,
                    price: `$${price.toFixed(2)}`,
                    store: stores[i],
                    url: `https://www.${stores[i].toLowerCase().replace(' ', '')}.com/search?q=${encodeURIComponent(productName)}`,
                    availability: Math.random() > 0.3 ? 'In Stock' : 'Limited Stock'
                });
            }
            
            return products.sort((a, b) => parseFloat(a.price.slice(1)) - parseFloat(b.price.slice(1)));
        }

        function displayResults(products) {
            if (products.length === 0) {
                noResults.style.display = 'block';
                return;
            }

            products.forEach(product => {
                const card = document.createElement('a');
                card.className = 'product-card';
                card.href = product.url;
                card.target = '_blank';
                
                card.innerHTML = `
                    <div class="product-image"></div>
                    <div class="product-info">
                        <div class="product-title">${product.title}</div>
                        <div class="product-price">${product.price}</div>
                        <div class="product-store">📍 ${product.store}</div>
                        <span class="product-availability">${product.availability}</span>
                    </div>
                `;
                
                resultsContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
