<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceScout - Compare Product Prices</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .tagline {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 40px;
        }

        .search-form {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin: 40px 0;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .location-info {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }

        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 1.5em;
            color: #667eea;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .product-store {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .product-shipping {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .product-availability {
            display: inline-block;
            padding: 4px 10px;
            background: #4caf50;
            color: white;
            border-radius: 12px;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .local-badge {
            display: inline-block;
            padding: 4px 10px;
            background: #ff9800;
            color: white;
            border-radius: 12px;
            font-size: 0.85em;
            margin-top: 10px;
            margin-left: 5px;
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin: 40px 0;
        }

        @media (max-width: 768px) {
            .search-form {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }

            .results-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 PriceScout</h1>
            <p class="tagline">Find the best deals in your location</p>
        </header>

        <div class="search-container">
            <form class="search-form" id="searchForm">
                <div class="input-group">
                    <label for="productName">Product Name</label>
                    <input 
                        type="text" 
                        id="productName" 
                        placeholder="e.g., iPhone 15, Nike Air Max..."
                        required
                    >
                </div>
                <div class="input-group">
                    <label for="location">Location</label>
                    <input 
                        type="text" 
                        id="location" 
                        placeholder="e.g., Nepal, India, USA"
                        required
                    >
                </div>
                <button type="submit" id="searchBtn">Search</button>
            </form>
        </div>

        <div id="locationInfo" class="location-info" style="display: none;"></div>

        <div id="loadingContainer" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Searching for the best prices in your location...</p>
        </div>

        <div id="resultsContainer" class="results-container"></div>
        <div id="noResults" class="no-results" style="display: none;">
            No results found. Try adjusting your search terms.
        </div>
    </div>

    <script>
        // Location-based store database
        const storesByLocation = {
            'nepal': [
                { name: 'Daraz Nepal', domain: 'daraz.com.np', local: true, currency: 'NPR' },
                { name: 'SastoDeal', domain: 'sastodeal.com', local: true, currency: 'NPR' },
                { name: 'Hamrobazaar', domain: 'hamrobazaar.com', local: true, currency: 'NPR' },
                { name: 'GyapuStore', domain: 'gyapu.com', local: true, currency: 'NPR' },
                { name: 'Amazon Global', domain: 'amazon.com', local: false, currency: 'USD', ships: true },
                { name: 'AliExpress', domain: 'aliexpress.com', local: false, currency: 'USD', ships: true }
            ],
            'india': [
                { name: 'Amazon India', domain: 'amazon.in', local: true, currency: 'INR' },
                { name: 'Flipkart', domain: 'flipkart.com', local: true, currency: 'INR' },
                { name: 'Myntra', domain: 'myntra.com', local: true, currency: 'INR' },
                { name: 'Snapdeal', domain: 'snapdeal.com', local: true, currency: 'INR' },
                { name: 'Tata CLiQ', domain: 'tatacliq.com', local: true, currency: 'INR' },
                { name: 'Croma', domain: 'croma.com', local: true, currency: 'INR' }
            ],
            'usa': [
                { name: 'Amazon', domain: 'amazon.com', local: true, currency: 'USD' },
                { name: 'Walmart', domain: 'walmart.com', local: true, currency: 'USD' },
                { name: 'Best Buy', domain: 'bestbuy.com', local: true, currency: 'USD' },
                { name: 'Target', domain: 'target.com', local: true, currency: 'USD' },
                { name: 'eBay', domain: 'ebay.com', local: true, currency: 'USD' },
                { name: 'Newegg', domain: 'newegg.com', local: true, currency: 'USD' }
            ],
            'uk': [
                { name: 'Amazon UK', domain: 'amazon.co.uk', local: true, currency: 'GBP' },
                { name: 'Argos', domain: 'argos.co.uk', local: true, currency: 'GBP' },
                { name: 'Currys', domain: 'currys.co.uk', local: true, currency: 'GBP' },
                { name: 'John Lewis', domain: 'johnlewis.com', local: true, currency: 'GBP' },
                { name: 'eBay UK', domain: 'ebay.co.uk', local: true, currency: 'GBP' }
            ],
            'default': [
                { name: 'Amazon', domain: 'amazon.com', local: false, currency: 'USD', ships: true },
                { name: 'eBay', domain: 'ebay.com', local: false, currency: 'USD', ships: true },
                { name: 'AliExpress', domain: 'aliexpress.com', local: false, currency: 'USD', ships: true },
                { name: 'Alibaba', domain: 'alibaba.com', local: false, currency: 'USD', ships: true }
            ]
        };

        const currencyRates = {
            'NPR': { symbol: 'Rs.', rate: 1, toUSD: 0.0075 },
            'INR': { symbol: '₹', rate: 1, toUSD: 0.012 },
            'USD': { symbol: '$', rate: 1, toUSD: 1 },
            'GBP': { symbol: '£', rate: 1, toUSD: 1.27 }
        };

        const form = document.getElementById('searchForm');
        const resultsContainer = document.getElementById('resultsContainer');
        const loadingContainer = document.getElementById('loadingContainer');
        const noResults = document.getElementById('noResults');
        const searchBtn = document.getElementById('searchBtn');
        const locationInfo = document.getElementById('locationInfo');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const productName = document.getElementById('productName').value;
            const location = document.getElementById('location').value.toLowerCase().trim();
            
            resultsContainer.innerHTML = '';
            noResults.style.display = 'none';
            locationInfo.style.display = 'none';
            loadingContainer.style.display = 'block';
            searchBtn.disabled = true;

            // Simulate search delay
            await new Promise(resolve => setTimeout(resolve, 1500));

            // Get stores for location
            let stores = storesByLocation[location] || storesByLocation['default'];
            
            // Check if it's a partial match
            if (!storesByLocation[location]) {
                for (let key in storesByLocation) {
                    if (location.includes(key) || key.includes(location)) {
                        stores = storesByLocation[key];
                        break;
                    }
                }
            }

            const products = generateLocationBasedProducts(productName, location, stores);
            
            if (products.length === 0) {
                noResults.style.display = 'block';
            } else {
                displayResults(products, location);
            }

            loadingContainer.style.display = 'none';
            searchBtn.disabled = false;
        });

        function generateLocationBasedProducts(productName, location, stores) {
            const products = [];
            const basePrice = Math.floor(Math.random() * 300) + 100;

            stores.forEach((store, index) => {
                const variance = (Math.random() - 0.5) * 0.3;
                const localPrice = basePrice * (1 + variance);
                const currency = currencyRates[store.currency];
                
                // Convert to local currency
                const priceInLocalCurrency = localPrice / currency.toUSD;
                const formattedPrice = `${currency.symbol}${Math.round(priceInLocalCurrency).toLocaleString()}`;

                const shipping = store.local 
                    ? 'Free delivery' 
                    : store.ships 
                        ? `Ships to ${location.charAt(0).toUpperCase() + location.slice(1)}`
                        : 'Check availability';

                products.push({
                    title: `${productName} - ${store.name}`,
                    price: formattedPrice,
                    store: store.name,
                    url: `https://www.${store.domain}/search?q=${encodeURIComponent(productName)}`,
                    shipping: shipping,
                    isLocal: store.local,
                    priceUSD: localPrice
                });
            });

            // Sort by local first, then by price
            products.sort((a, b) => {
                if (a.isLocal !== b.isLocal) {
                    return b.isLocal - a.isLocal;
                }
                return a.priceUSD - b.priceUSD;
            });

            return products;
        }

        function displayResults(products, location) {
            const localCount = products.filter(p => p.isLocal).length;
            const locationName = location.charAt(0).toUpperCase() + location.slice(1);
            
            locationInfo.innerHTML = `📍 Found ${products.length} stores for "${products[0].title.split(' - ')[0]}" in ${locationName} (${localCount} local, ${products.length - localCount} international)`;
            locationInfo.style.display = 'block';

            products.forEach(product => {
                const card = document.createElement('a');
                card.className = 'product-card';
                card.href = product.url;
                card.target = '_blank';
                
                const emoji = product.isLocal ? '🏪' : '🌍';
                
                card.innerHTML = `
                    <div class="product-image">${emoji}</div>
                    <div class="product-info">
                        <div class="product-title">${product.title}</div>
                        <div class="product-price">${product.price}</div>
                        <div class="product-store">🏪 ${product.store}</div>
                        <div class="product-shipping">📦 ${product.shipping}</div>
                        ${product.isLocal 
                            ? '<span class="local-badge">Local Store</span>' 
                            : '<span class="product-availability">International</span>'
                        }
                    </div>
                `;
                
                resultsContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
